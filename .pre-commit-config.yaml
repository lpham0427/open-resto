# Git hooks managed by prek (a drop-in replacement for pre-commit).
# Install with: uv run prek install
# Keep the ruff-pre-commit rev in sync with the ruff version in uv.lock.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
        # CloudFormation intrinsic tags such as !Ref are not valid plain YAML.
        exclude: ^template\.yaml$
